<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0866ff">
<title>Family Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f8;color:#172033}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#0866ff;color:white}
button:disabled{opacity:.5}
input,textarea{width:100%;padding:12px;border:1px solid #d5dce8;border-radius:9px;outline:none}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:white;padding:28px;border-radius:18px;width:100%;max-width:390px;box-shadow:0 8px 35px #15284a18}
.logo{font-size:28px;font-weight:bold;color:#0866ff;text-align:center}
.sub{text-align:center;color:#718096;margin:8px 0 24px}
#app{height:100vh;display:flex;flex-direction:column}
.top{height:60px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5eaf1}
.brand{font-weight:bold;color:#0866ff;font-size:20px}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:300px;background:white;border-right:1px solid #e5eaf1;display:flex;flex-direction:column}
.side-head{padding:15px;border-bottom:1px solid #eee}
.side-head h3{margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:12px;padding:8px}
.chat-list{overflow:auto;flex:1}
.chat-item{padding:14px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.chat-item:hover,.chat-item.active{background:#edf4ff}
.chat-item b{display:block}
.chat-item small{color:#718096}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.welcome{margin:auto;text-align:center;color:#718096;padding:20px}
.chat-head{background:white;padding:13px 16px;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-between}
.chat-head h3{margin:0}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 12px;border-radius:13px;background:white;box-shadow:0 1px 3px #0000000b;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#dceaff}
.msg small{display:block;color:#758198;font-size:11px;margin-top:5px}
.msg-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.msg-actions button{font-size:11px;padding:5px 7px;background:#e7edf7;color:#26354c}
.msg img{max-width:220px;max-height:220px;border-radius:8px;display:block;margin-top:6px}
.composer{background:white;padding:12px;border-top:1px solid #e5eaf1}
.composer-row{display:flex;gap:8px;align-items:center}
.composer-row input{flex:1;min-width:0}
.reply-box{font-size:12px;background:#eef4ff;padding:8px;margin-bottom:8px;border-radius:8px}
.page{padding:20px;overflow:auto}
.card{background:white;padding:17px;border-radius:13px;margin-bottom:13px;box-shadow:0 2px 10px #00000008}
.member{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.member-info{min-width:0}
.member-info small{display:block;color:#718096;overflow-wrap:anywhere}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dce8ff;display:inline-flex;align-items:center;justify-content:center;color:#0866ff;font-weight:bold;flex-shrink:0}
.profile-row{display:flex;align-items:center;gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:10px;z-index:99;max-width:90%;font-size:14px}
.status{font-size:13px;color:#718096;margin-top:10px}
@media(max-width:700px){
 .sidebar{width:110px}
 .side-head{padding:8px}
 .side-head h3{font-size:13px}
 .tabs{display:block}
 .tabs button{width:100%;margin:2px 0;padding:7px 3px;font-size:11px}
 .chat-item{padding:10px 5px;font-size:12px}
 .chat-item small{font-size:10px}
 .msg{max-width:90%}
 .page{padding:12px}
}
</style>
</head>

<body>

<section id="login">
 <div class="login-card">
  <div class="logo">Family Connect</div>
  <div class="sub">আপনার পরিবারের ব্যক্তিগত যোগাযোগ</div>
  <label>আপনার ইমেইল</label>
  <input id="emailInput" type="email" placeholder="name@example.com">
  <button id="loginBtn" style="width:100%;margin-top:13px">Send Login Link</button>
  <div id="loginStatus" class="status"></div>
 </div>
</section>

<div id="app" class="hidden">
 <header class="top">
  <div class="brand">Family Connect</div>
  <div>
   <span id="topName"></span>
   <button id="logoutBtn">Logout</button>
  </div>
 </header>

 <div class="layout">
  <aside class="sidebar">
   <div class="side-head">
    <h3>পরিবার</h3>
    <div class="tabs">
     <button data-page="chats">চ্যাট</button>
     <button data-page="members">সদস্য</button>
     <button data-page="profile">প্রোফাইল</button>
     <button data-page="admin" id="adminTab" class="hidden">Admin</button>
    </div>
   </div>
   <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="main">
   <section id="chatsPage" class="page">
    <div id="welcome" class="welcome">
     <h2>Family Connect</h2>
     <p>পরিবারের ব্যক্তিগত যোগাযোগ</p>
     <p>চ্যাট শুরু করতে বাম পাশ থেকে একটি কথোপকথন নির্বাচন করুন।</p>
    </div>

    <div id="chatPanel" class="hidden" style="height:100%;display:flex;flex-direction:column">
     <div class="chat-head">
      <h3 id="chatTitle">Chat</h3>
      <button id="refreshBtn">Refresh</button>
     </div>
     <div id="messages" class="messages"></div>
     <div class="composer">
      <div id="replyPreview" class="reply-box hidden"></div>
      <div class="composer-row">
       <button id="emojiBtn" title="Emoji">😊</button>
       <button id="imageBtn" title="ছবি">📷</button>
       <input id="messageInput" placeholder="মেসেজ লিখুন...">
       <button id="sendBtn">Send</button>
      </div>
      <input type="file" id="imageFile" accept="image/*" class="hidden">
     </div>
    </div>
   </section>

   <section id="membersPage" class="page hidden">
    <div class="card">
     <h2>পরিবারের সদস্য</h2>
     <div id="membersList">লোড হচ্ছে...</div>
    </div>
   </section>

   <section id="profilePage" class="page hidden">
    <div class="card">
     <h2>প্রোফাইল সেটিংস</h2>
     <div class="profile-row">
      <img id="profileAvatar" class="avatar" src="" alt="">
      <div>
       <b id="profileEmail"></b>
       <div><small id="profileRole"></small></div>
      </div>
     </div>
     <br>
     <label>আপনার নাম</label>
     <input id="profileName" placeholder="আপনার নাম">
     <br><br>
     <label>প্রোফাইল ছবি</label>
     <input id="avatarFile" type="file" accept="image/*">
     <br><br>
     <button id="saveProfileBtn">Save Profile</button>
     <div id="profileStatus" class="status"></div>
    </div>
   </section>

   <section id="adminPage" class="page hidden">
    <div class="card">
     <h2>Admin Dashboard</h2>
     <p>পরিবারের সদস্যদের অনুমোদন ও নিয়ন্ত্রণ করুন।</p>
     <button id="refreshMembersBtn">Refresh Members</button>
     <div id="adminMembersList"></div>
    </div>
   </section>
  </main>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
/* SUPABASE CONFIG */
const SUPABASE_URL = "https://vtvwfyooiblpcoofzdav.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rb2tYhvPfhZIqhGV0gPCLA_SODQoFNg";
const ADMIN_EMAIL = "sagor516@gmail.com";
const AVATAR_BUCKET = "familly-avatars";
const IMAGE_BUCKET = "family-chat-images";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentConversation = null;
let currentReply = null;
let messagesChannel = null;
let refreshTimer = null;
let loadedMessages = [];

const $ = id => document.getElementById(id);

function toast(message){
 const el=$("toast");
 el.textContent=message;
 el.classList.remove("hidden");
 setTimeout(()=>el.classList.add("hidden"),3000);
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function safeImageURL(url){
 try{
  const u=new URL(url);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch{return "";}
}

function timeText(value){
 if(!value)return "";
 return new Date(value).toLocaleString("bn-BD",{
  hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"
 });
}

function isAdmin(){
 return currentProfile?.role==="admin" ||
  currentUser?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();
}

/* PAGE NAVIGATION */
function showPage(page){
 ["chats","members","profile","admin"].forEach(name=>{
  $(name+"Page").classList.toggle("hidden",name!==page);
 });
 if(page==="members")loadMembers();
 if(page==="profile")fillProfile();
 if(page==="admin")loadAdminMembers();
 if(page==="chats")loadChatList();
}

document.querySelectorAll("[data-page]").forEach(btn=>{
 btn.addEventListener("click",()=>showPage(btn.dataset.page));
});

/* AUTHENTICATION */
async function sendLoginLink(){
 const email=$("emailInput").value.trim();
 if(!email){toast("ইমেইল লিখুন");return;}
 $("loginBtn").disabled=true;
 $("loginStatus").textContent="লিংক পাঠানো হচ্ছে...";
 const {error}=await db.auth.signInWithOtp({
  email,
  options:{emailRedirectTo:location.origin+location.pathname}
 });
 $("loginBtn").disabled=false;
 $("loginStatus").textContent=error?error.message:"ইমেইলে লগইন লিংক পাঠানো হয়েছে।";
}

$("loginBtn").addEventListener("click",sendLoginLink);

async function logout(){
 if(messagesChannel)await db.removeChannel(messagesChannel);
 stopRefresh();
 await db.auth.signOut();
 currentUser=null;
 currentProfile=null;
 currentConversation=null;
 $("app").classList.add("hidden");
 $("login").classList.remove("hidden");
}

$("logoutBtn").addEventListener("click",logout);

async function checkLogin(){
 const {data,error}=await db.auth.getSession();
 if(error){toast(error.message);return;}
 if(data.session){
  currentUser=data.session.user;
  await loadApp();
 }else{
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
 }
}

db.auth.onAuthStateChange(async(event,session)=>{
 if(session?.user){
  currentUser=session.user;
  if(event==="SIGNED_IN")await loadApp();
 }
 if(event==="SIGNED_OUT"){
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
 }
});

async function loadApp(){
 if(!currentUser)return;

 const {data,error}=await db.from("profiles")
  .select("*").eq("user_id",currentUser.id).maybeSingle();

 if(error){toast("Profile error: "+error.message);return;}

 if(!data){
  const {error:insertError}=await db.from("profiles").insert({
   user_id:currentUser.id,
   email:currentUser.email,
   display_name:currentUser.email.split("@")[0],
   role:currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":"member",
   status:"pending",
   approved:false
  });
  if(insertError){toast(insertError.message);return;}
  const {data:newProfile}=await db.from("profiles")
   .select("*").eq("user_id",currentUser.id).maybeSingle();
  currentProfile=newProfile;
 }else{
  currentProfile=data;
 }

 if(!currentProfile)return;

 if(currentProfile.approved!==true && !isAdmin()){
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("loginStatus").textContent="আপনার অ্যাকাউন্ট Admin অনুমোদনের অপেক্ষায় আছে।";
  return;
 }

 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("topName").textContent=currentProfile.display_name||currentUser.email;
 $("adminTab").classList.toggle("hidden",!isAdmin());

 await loadMembers();
 await loadChatList();
 showPage("chats");
}

/* PROFILE */
function fillProfile(){
 if(!currentProfile)return;
 $("profileEmail").textContent=currentUser.email;
 $("profileRole").textContent="Role: "+(currentProfile.role||"member")+
  " | Status: "+(currentProfile.status||"pending");
 $("profileName").value=currentProfile.display_name||"";
 $("profileAvatar").src=safeImageURL(currentProfile.avatar_url)||"";
}

async function saveProfile(){
 const name=$("profileName").value.trim();
 if(!name){toast("নাম লিখুন");return;}
 const {data,error}=await db.from("profiles").update({
  display_name:name
 }).eq("user_id",currentUser.id).select().maybeSingle();

 if(error){toast(error.message);return;}
 if(data)currentProfile=data;
 $("topName").textContent=name;
 toast("প্রোফাইল আপডেট হয়েছে");
}

$("saveProfileBtn").addEventListener("click",saveProfile);

$("avatarFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){toast("ছবির ফাইল নির্বাচন করুন");return;}
 if(file.size>5*1024*1024){toast("ছবি ৫ MB-এর কম হতে হবে");return;}

 const ext=file.name.split(".").pop().toLowerCase();
 const path=currentUser.id+"/"+Date.now()+"."+ext;
 const {error:uploadError}=await db.storage.from(AVATAR_BUCKET)
  .upload(path,file,{upsert:true});
 if(uploadError){toast("Upload error: "+uploadError.message);return;}

 const {data:urlData}=db.storage.from(AVATAR_BUCKET).getPublicUrl(path);
 const {data,error}=await db.from("profiles").update({
  avatar_url:urlData.publicUrl
 }).eq("user_id",currentUser.id).select().maybeSingle();

 if(error){toast(error.message);return;}
 if(data)currentProfile=data;
 fillProfile();
 toast("প্রোফাইল ছবি আপলোড হয়েছে");
});

/* MEMBERS */
async function loadMembers(){
 const box=$("membersList");
 box.textContent="লোড হচ্ছে...";
 const {data,error}=await db.from("profiles")
  .select("user_id,display_name,email,avatar_url,role,status,approved")
  .order("display_name");

 if(error){box.textContent=error.message;return;}
 box.innerHTML="";
 (data||[]).forEach(p=>{
  const div=document.createElement("div");
  div.className="member";
  div.innerHTML=`
   <div class="member-info">
    <b>${escapeHTML(p.display_name||"Member")}</b>
    <small>${escapeHTML(p.email||"")}</small>
    <small>${escapeHTML(p.role||"member")} | ${p.approved?"Approved":"Pending"}</small>
   </div>`;
  box.appendChild(div);
 });
}

/* ADMIN */
async function loadAdminMembers(){
 if(!isAdmin()){toast("Admin access প্রয়োজন");return;}
 const box=$("adminMembersList");
 box.textContent="লোড হচ্ছে...";
 const {data,error}=await db.from("profiles")
  .select("user_id,display_name,email,role,status,approved")
  .order("display_name");

 if(error){box.textContent=error.message;return;}
 box.innerHTML="";
 (data||[]).forEach(p=>{
  const div=document.createElement("div");
  div.className="member";
  const info=document.createElement("div");
  info.className="member-info";
  info.innerHTML=`<b>${escapeHTML(p.display_name||"Member")}</b>
   <small>${escapeHTML(p.email||"")}</small>
   <small>${p.approved?"Approved":"Pending"}</small>`;
  div.appendChild(info);

  if(p.user_id!==currentUser.id){
   const btn=document.createElement("button");
   btn.textContent=p.approved?"Revoke":"Approve";
   btn.addEventListener("click",()=>setApproval(p.user_id,!p.approved));
   div.appendChild(btn);
  }
  box.appendChild(div);
 });
}

async function setApproval(userId,approved){
 if(!isAdmin())return;
 const {error}=await db.from("profiles").update({
  approved,
  status:approved?"approved":"pending"
 }).eq("user_id",userId);

 if(error){toast("Approval error: "+error.message);return;}
 toast(approved?"সদস্য অনুমোদিত":"অনুমোদন বাতিল হয়েছে");
 await loadAdminMembers();
 await loadMembers();
}

$("refreshMembersBtn").addEventListener("click",loadAdminMembers);

/* CHAT LIST */
async function loadChatList(){
 const box=$("chatList");
 box.innerHTML="লোড হচ্ছে...";

 const {data:members,error:mError}=await db.from("conversation_members")
  .select("conversation_id,owner_id")
  .eq("owner_id",currentUser.id);

 if(mError){box.textContent=mError.message;return;}
 if(!members?.length){box.textContent="এখনো কোনো চ্যাট নেই";return;}

 const ids=[...new Set(members.map(x=>x.conversation_id))];
 const {data:conversations,error}=await db.from("conversations")
  .select("id,conversation_kind,created_at")
  .in("id",ids);

 if(error){box.textContent=error.message;return;}
 box.innerHTML="";

 (conversations||[]).forEach(c=>{
  const div=document.createElement("div");
  div.className="chat-item";
  div.innerHTML=`<b>${c.conversation_kind==="family_group"?"Family Group":"Private Chat"}</b>
   <small>কথোপকথন খুলুন</small>`;
  div.addEventListener("click",()=>openConversation(c));
  box.appendChild(div);
 });
}

async function openConversation(conversation){
 currentConversation=conversation.id;
 currentReply=null;
 $("replyPreview").classList.add("hidden");
 $("welcome").classList.add("hidden");
 $("chatPanel").classList.remove("hidden");
 $("chatTitle").textContent=
  conversation.conversation_kind==="family_group"?"Family Group":"Private Chat";
 await loadMessages();
 subscribeMessages();
}

/* MESSAGES */
async function loadMessages(){
 if(!currentConversation)return;

 const box=$("messages");
 const {data,error}=await db.from("messages")
  .select("*")
  .eq("conversation_id",currentConversation)
  .order("created_at",{ascending:true})
  .limit(100);

 if(error){toast("Message error: "+error.message);return;}
 loadedMessages=data||[];

 const ownerIds=[...new Set(loadedMessages.map(m=>m.owner_id))];
 let profiles=[];
 if(ownerIds.length){
  const result=await db.from("profiles")
   .select("user_id,display_name,avatar_url")
   .in("user_id",ownerIds);
  if(!result.error)profiles=result.data||[];
 }

 const profileMap={};
 profiles.forEach(p=>profileMap[p.user_id]=p);

 box.innerHTML="";
 loadedMessages.forEach(m=>{
  const mine=m.owner_id===currentUser.id;
  const sender=profileMap[m.owner_id]?.display_name||"Member";
  const div=document.createElement("div");
  div.className="msg"+(mine?" mine":"");

  let attachment="";
  if(m.attachment_url){
   const url=safeImageURL(m.attachment_url);
   if(url && m.attachment_kind==="image"){
    attachment=`<img src="${escapeHTML(url)}" alt="Shared image">`;
   }else if(url){
    attachment=`<a href="${escapeHTML(url)}" target="_blank" rel="noopener">Attachment খুলুন</a>`;
   }
  }

  const reply=m.reply_to_id?loadedMessages.find(x=>x.id===m.reply_to_id):null;
  div.innerHTML=`
   <b>${escapeHTML(sender)}</b>
   ${reply?`<div class="reply-box">↪ ${escapeHTML(reply.message_text||"ছবি")}</div>`:""}
   <div>${escapeHTML(m.message_text||"")}</div>
   ${attachment}
   <small>${timeText(m.created_at)} ${m.updated_at?"(edited)":""}</small>
   <div class="msg-actions">
    <button data-action="reply">Reply</button>
    <button data-action="react">❤️</button>
    ${mine?'<button data-action="edit">Edit</button><button data-action="delete">Delete</button>':""}
   </div>`;

  div.querySelector('[data-action="reply"]').onclick=()=>setReply(m);
  div.querySelector('[data-action="react"]').onclick=()=>reactToMessage(m);
  const edit=div.querySelector('[data-action="edit"]');
  if(edit)edit.onclick=()=>editMessage(m);
  const del=div.querySelector('[data-action="delete"]');
  if(del)del.onclick=()=>deleteMessage(m);
  box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}

function setReply(message){
 currentReply=message;
 $("replyPreview").textContent="Reply: "+(message.message_text||"ছবি");
 $("replyPreview").classList.remove("hidden");
 $("messageInput").focus();
}

$("cancelReplyBtn")?.addEventListener("click",()=>{
 currentReply=null;
 $("replyPreview").classList.add("hidden");
});

async function sendMessage(){
 if(!currentConversation){toast("আগে একটি চ্যাট খুলুন");return;}
 const input=$("messageInput");
 const message=input.value.trim();
 if(!message)return;

 $("sendBtn").disabled=true;
 const payload={
  conversation_id:currentConversation,
  owner_id:currentUser.id,
  message_text:message,
  reply_to_id:currentReply?.id||null
 };

 const {error}=await db.from("messages").insert(payload);
 $("sendBtn").disabled=false;

 if(error){toast("Send error: "+error.message);return;}
 input.value="";
 currentReply=null;
 $("replyPreview").classList.add("hidden");
 await loadMessages();
}

$("sendBtn").addEventListener("click",sendMessage);
$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

async function editMessage(message){
 const updated=prompt("মেসেজ পরিবর্তন করুন:",message.message_text||"");
 if(updated===null||!updated.trim())return;
 const {error}=await db.from("messages").update({
  message_text:updated.trim(),
  updated_at:new Date().toISOString()
 }).eq("id",message.id).eq("owner_id",currentUser.id);

 if(error){toast(error.message);return;}
 await loadMessages();
}

async function deleteMessage(message){
 if(!confirm("এই মেসেজটি মুছে ফেলবেন?"))return;
 const {error}=await db.from("messages").delete()
  .eq("id",message.id).eq("owner_id",currentUser.id);
 if(error){toast(error.message);return;}
 await loadMessages();
}

async function reactToMessage(message){
 const emoji="❤️";
 const {data,error}=await db.from("message_reactions")
  .select("message_id,user_id,emoji")
  .eq("message_id",message.id)
  .eq("user_id",currentUser.id)
  .eq("emoji",emoji)
  .maybeSingle();

 if(error){toast("Reaction error: "+error.message);return;}

 if(data){
  const result=await db.from("message_reactions").delete()
   .eq("message_id",message.id)
   .eq("user_id",currentUser.id)
   .eq("emoji",emoji);
  if(result.error)toast(result.error.message);
 }else{
  const result=await db.from("message_reactions").insert({
   message_id:message.id,user_id:currentUser.id,emoji
  });
  if(result.error)toast(result.error.message);
  else toast("❤️ Reaction যোগ হয়েছে");
 }
}

/* REALTIME */
function subscribeMessages(){
 if(messagesChannel)db.removeChannel(messagesChannel);
 if(!currentConversation)return;

 messagesChannel=db.channel("messages-"+currentConversation)
  .on("postgres_changes",{
   event:"*",schema:"public",table:"messages",
   filter:"conversation_id=eq."+currentConversation
  },()=>loadMessages())
  .subscribe();
}

$("refreshBtn").addEventListener("click",()=>{
 loadMessages();
 loadChatList();
});

function stopRefresh(){
 if(refreshTimer)clearInterval(refreshTimer);
 refreshTimer=null;
}
function startRefresh(){
 stopRefresh();
 refreshTimer=setInterval(()=>{
  if(currentConversation)loadMessages();
 },20000);
}

/* IMAGE MESSAGE */
$("imageBtn").addEventListener("click",()=>$("imageFile").click());

$("imageFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!currentConversation){toast("আগে একটি চ্যাট খুলুন");return;}
 if(!file.type.startsWith("image/")){toast("শুধু ছবি নির্বাচন করুন");return;}
 if(file.size>5*1024*1024){toast("ছবি ৫ MB-এর কম হতে হবে");return;}

 toast("ছবি আপলোড হচ্ছে...");
 const ext=file.name.split(".").pop().toLowerCase();
 const path=currentUser.id+"/"+Date.now()+"."+ext;

 const {error:uploadError}=await db.storage.from(IMAGE_BUCKET)
  .upload(path,file,{upsert:true});

 if(uploadError){toast("Upload error: "+uploadError.message);return;}

 const {data:urlData}=db.storage.from(IMAGE_BUCKET).getPublicUrl(path);
 const {error}=await db.from("messages").insert({
  conversation_id:currentConversation,
  owner_id:currentUser.id,
  message_text:"",
  attachment_url:urlData.publicUrl,
  attachment_kind:"image"
 });

 if(error){toast("Message error: "+error.message);return;}
 e.target.value="";
 await loadMessages();
 toast("ছবি পাঠানো হয়েছে");
});

/* EMOJI */
$("emojiBtn").addEventListener("click",()=>{
 const emojis=["😊","❤️","😂","👍","🥰","🙏","😍","😢"];

 if(choice&&emojis.includes(choice)){
  $("messageInput").value+=choice;
