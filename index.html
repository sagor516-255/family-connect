<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2481cc">
<title>Family Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#2481cc;
  --blue-dark:#1769aa;
  --blue-light:#e3f2ff;
  --bg:#eaf2f8;
  --white:#fff;
  --text:#17212b;
  --muted:#718096;
  --border:#e1e8ef;
  --green:#d9fdd3;
  --danger:#e34b4b;
  --shadow:0 4px 20px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow:hidden;
  height:100dvh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* Topbar */
.topbar{
  height:56px;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:relative;
  z-index:50;
}
.brand{font-size:18px;font-weight:700;letter-spacing:0.3px}
.top-actions{display:flex;align-items:center;gap:10px}
.top-actions button{
  border:1px solid rgba(255,255,255,0.35);
  border-radius:8px;
  padding:6px 12px;
  color:white;
  font-size:13px;
}

/* App Layout */
.app{
  height:calc(100dvh - 56px);
  max-width:1400px;
  margin:0 auto;
  display:flex;
  background:white;
  overflow:hidden;
}
.sidebar{
  width:340px;
  min-width:300px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#f8fafc;
}
.side-head{padding:12px}
.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:22px;
  background:white;
  padding:11px 16px;
  outline:none;
  font-size:14px;
}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,129,204,0.15)}
.tabs{display:flex;gap:4px;padding:0 10px 10px}
.tabs button{
  flex:1;
  padding:9px 4px;
  border-radius:18px;
  color:#526273;
  background:#edf3f8;
  font-size:12px;
  font-weight:500;
  transition:0.2s;
}
.tabs button.active{
  background:var(--blue-light);
  color:var(--blue-dark);
  font-weight:700;
}
.chat-list{flex:1;overflow-y:auto}
