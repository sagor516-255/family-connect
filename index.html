<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2481cc">
<title>Family Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#2481cc;
  --blue-dark:#1769aa;
  --blue-light:#e3f2ff;
  --bg:#eaf2f8;
  --white:#fff;
  --text:#17212b;
  --muted:#718096;
  --border:#e1e8ef;
  --green:#d9fdd3;
  --danger:#e34b4b;
  --shadow:0 4px 20px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow:hidden;
  height:100dvh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* Topbar */
.topbar{
  height:56px;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:relative;
  z-index:50;
}
.brand{font-size:18px;font-weight:700;letter-spacing:0.3px}
.top-actions{display:flex;align-items:center;gap:10px}
.top-actions button{
  border:1px solid rgba(255,255,255,0.35);
  border-radius:8px;
  padding:6px 12px;
  color:white;
  font-size:13px;
}

/* App Layout */
.app{
  height:calc(100dvh - 56px);
  max-width:1400px;
  margin:0 auto;
  display:flex;
  background:white;
  overflow:hidden;
}
.sidebar{
  width:340px;
  min-width:300px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#f8fafc;
}
.side-head{padding:12px}
.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:22px;
  background:white;
  padding:11px 16px;
  outline:none;
  font-size:14px;
}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,129,204,0.15)}
.tabs{display:flex;gap:4px;padding:0 10px 10px}
.tabs button{
  flex:1;
  padding:9px 4px;
  border-radius:18px;
  color:#526273;
  background:#edf3f8;
  font-size:12px;
  font-weight:500;
  transition:0.2s;
}
.tabs button.active{
  background:var(--blue-light);
  color:var(--blue-dark);
  font-weight:700;
}
.chat-list{flex:1;overflow-y:auto}

/* Chat Item */
.chat-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-bottom:1px solid #f1f3f5;
  cursor:pointer;
  transition:0.15s;
}
.chat-item:hover,.chat-item.active{background:#e8f3fc}
.avatar{
  width:48px;height:48px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#dceaf6;
  color:var(--blue-dark);
  font-weight:700;
  font-size:15px;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{min-width:0;flex:1}
.chat-name{font-weight:700;margin-bottom:3px;font-size:15px}
.chat-preview{
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Chat Main */
.chat-main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#eaf2f8;
}
.chat-head{
  min-height:60px;
  padding:8px 14px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}
.chat-head-info{flex:1;min-width:0}
.chat-title{font-weight:700;font-size:16px}
.chat-status{font-size:12px;color:var(--muted);margin-top:2px}
.back-btn{
  display:none;
  font-size:28px;
  color:var(--blue);
  padding:4px 8px 4px 0;
  line-height:1;
}

/* Messages */
.messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.message{
  max-width:min(78%,520px);
  background:white;
  padding:10px 13px;
  border-radius:16px 16px 16px 4px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
  align-self:flex-start;
  overflow-wrap:anywhere;
  position:relative;
}
.message.mine{
  background:var(--green);
  align-self:flex-end;
  border-radius:16px 16px 4px 16px;
}
.message-sender{
  color:var(--blue-dark);
  font-weight:700;
  font-size:12px;
  margin-bottom:4px;
}
.message-text{white-space:pre-wrap;line-height:1.45;font-size:15px}
.message img{
  max-width:100%;
  max-height:280px;
  display:block;
  border-radius:10px;
  margin-top:6px;
  cursor:pointer;
}
.message-time{
  text-align:right;
  color:#788995;
  font-size:11px;
  margin-top:5px;
}
.reply-quote{
  background:#edf5fc;
  border-left:3px solid var(--blue);
  padding:6px 9px;
  border-radius:6px;
  margin-bottom:6px;
  font-size:12px;
  color:#526273;
}
.message-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:6px;
  opacity:0.7;
}
.message-actions button{
  font-size:12px;
  color:#536b7e;
  padding:2px 5px;
  border-radius:4px;
}
.message-actions button:hover{background:rgba(0,0,0,0.05)}
.reactions{font-size:14px;margin-top:4px;letter-spacing:2px}

/* Composer */
.composer{
  background:white;
  padding:10px;
  display:flex;
  align-items:center;
  gap:6px;
  border-top:1px solid var(--border);
}
.composer input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:#f1f5f8;
  padding:12px 16px;
  border-radius:24px;
  font-size:15px;
}
.icon-btn{
  color:var(--blue);
  font-size:22px;
  padding:8px;
  border-radius:50%;
  transition:0.15s;
}
.icon-btn:hover{background:var(--blue-light)}
.send-btn{
  width:44px;height:44px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.15s;
}
.send-btn:disabled{opacity:0.5;cursor:not-allowed}
.reply-preview{
  padding:9px 14px;
  background:#edf6ff;
  border-left:4px solid var(--blue);
  font-size:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* Pages */
.pages{
  flex:1;
  overflow:auto;
  padding:18px;
  background:white;
  height:calc(100dvh - 56px);
}
.panel{
  max-width:680px;
  margin:0 auto 20px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:white;
  box-shadow:var(--shadow);
}
.panel h2{margin-bottom:8px;font-size:20px}
.panel input,.panel textarea{
  width:100%;
  padding:12px 14px;
  margin:8px 0 14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:15px;
}
.panel input:focus,.panel textarea:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(36,129,204,0.12);
}
.primary{
  background:var(--blue);
  color:white;
  padding:11px 18px;
  border-radius:10px;
  font-weight:600;
  font-size:14px;
  transition:0.15s;
}
.primary:hover{background:var(--blue-dark)}
.primary:disabled{opacity:0.6;cursor:not-allowed}
.secondary{
  background:#edf3f8;
  color:#29465e;
  padding:10px 16px;
  border-radius:10px;
  font-weight:500;
}
.danger{
  background:#ffeded;
  color:#bd3030;
  padding:9px 14px;
  border-radius:8px;
  font-size:13px;
}
.member-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.member-info{flex:1;min-width:0}
.member-email{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.small{font-size:12px;color:var(--muted);margin-top:6px}

/* Login */
.login-wrap{
  min-height:calc(100dvh - 56px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  width:min(400px,100%);
  background:white;
  padding:32px 28px;
  border-radius:20px;
  box-shadow:0 12px 40px rgba(23,70,107,0.12);
}
.login-card h2{margin-bottom:6px}
.login-card p{color:var(--muted);margin-bottom:20px;font-size:14px}
.login-card input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:14px;
  font-size:15px;
}
.login-card button{width:100%;padding:14px;font-size:15px}

/* Toast */
.toast{
  position:fixed;
  z-index:9999;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#17212b;
  color:white;
  padding:12px 22px;
  border-radius:30px;
  max-width:90%;
  text-align:center;
  font-size:14px;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{
  from{transform:translateX(-50%) translateY(20px);opacity:0}
  to{transform:translateX(-50%) translateY(0);opacity:1}
}

/* Empty & Loading */
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
  font-size:14px;
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:white;
  border-radius:18px;
  width:min(400px,100%);
  max-height:85dvh;
  overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.2);
  animation:scaleIn 0.25s ease;
}
@keyframes scaleIn{
  from{transform:scale(0.95);opacity:0}
  to{transform:scale(1);opacity:1}
}
.modal-header{
  padding:18px 20px 10px;
  font-weight:700;
  font-size:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.modal-body{padding:10px 20px 20px}
.modal-footer{
  padding:0 20px 18px;
  display:flex;
  gap:10px;
  justify-content:flex-end;
}
.modal textarea{
  width:100%;
  min-height:90px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  resize:vertical;
  font-size:15px;
}
.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
  margin-top:10px;
}
.emoji-grid button{
  font-size:22px;
  padding:8px;
  border-radius:10px;
  transition:0.15s;
}
.emoji-grid button:hover{background:#f0f4f8}

/* Mobile */
@media(max-width:720px){
  .topbar{height:52px}
  .app{height:calc(100dvh - 52px)}
  .sidebar{width:100%;min-width:0;border:0}
  .chat-main{display:none;width:100%}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .chat-main{display:flex}
  .back-btn{display:block}
  .messages{padding:12px 10px}
  .message{max-width:85%}
  .pages{padding:12px;height:calc(100dvh - 52px)}
  .tabs button{font-size:11px;padding:8px 2px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">💬 Family Connect</div>
  <div class="top-actions">
    <span id="topName">Guest</span>
    <button id="logoutBtn" class="hidden">Logout</button>
  </div>
</header>

<!-- Login -->
<section id="loginPage" class="login-wrap">
  <div class="login-card">
    <h2>Family Connect</h2>
    <p>আপনার পরিবারের ব্যক্তিগত যোগাযোগের জায়গা</p>
    <input id="emailInput" type="email" placeholder="আপনার ইমেইল লিখুন" autocomplete="email">
    <button class="primary" id="loginBtn">লগইন লিংক পাঠান</button>
    <p class="small" id="loginMessage" style="margin-top:12px;text-align:center">আপনার ইমেইলে একটি লগইন লিংক পাঠানো হবে।</p>
  </div>
</section>

<!-- Main App -->
<main class="app hidden" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <input class="search" id="chatSearch" placeholder="চ্যাট খুঁজুন...">
    </div>
    <div class="tabs">
      <button class="active" data-page="chats">Chats</button>
      <button data-page="members">Members</button>
      <button data-page="profile">Profile</button>
      <button data-page="admin">Admin</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <section class="chat-main">
    <div class="chat-head">
      <button class="back-btn" id="backBtn">‹</button>
      <div class="avatar" id="chatAvatar">FC</div>
      <div class="chat-head-info">
        <div class="chat-title" id="chatTitle">Family Connect</div>
        <div class="chat-status" id="chatStatus">একটি চ্যাট নির্বাচন করুন</div>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty">চ্যাট শুরু করতে একজন সদস্য নির্বাচন করুন।</div>
    </div>
    <div id="replyPreview" class="reply-preview hidden"></div>
    <div class="composer">
      <button class="icon-btn" id="emojiBtn" title="ইমোজি">☺</button>
      <button class="icon-btn" id="imageBtn" title="ছবি পাঠান">📎</button>
      <input id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
      <input type="file" id="imageFile" accept="image/*" hidden>
    </div>
  </section>
</main>

<!-- Other Pages -->
<section id="otherPage" class="pages hidden">
  <div id="membersPage" class="hidden"></div>
  <div id="profilePage" class="hidden"></div>
  <div id="adminPage" class="hidden"></div>
</section>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Modal Container -->
<div id="modalRoot"></div>

<script>
/* ====================== CONFIG ====================== */
const SUPABASE_URL = "https://vtvwfyooiblpcoofzdav.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rb2tYhvPfhZlqGV0gPCLA_SODQoFNg";
const ADMIN_EMAIL = "sagor516@gmail.com";
const AVATAR_BUCKET = "family-avatars";          // টাইপো ঠিক করা হয়েছে
const IMAGE_BUCKET = "family-chat-images";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ====================== STATE ====================== */
let currentUser = null;
let myProfile = null;
let isAdmin = false;
let activeConversation = null;
let activeConversationKind = null;
let activeChatName = "";
let activeChatAvatar = "";
let currentReply = null;
let messagesCache = [];
let membersCache = [];
let conversationsCache = [];
let realtimeChannel = null;
let refreshTimer = null;
let currentPage = "chats";
let isSending = false;

const $ = id => document.getElementById(id);

/* ====================== HELPERS ====================== */
function toast(msg, duration = 3000) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add("hidden"), duration);
}

function escapeHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function initials(name) {
  return (name || "FC").trim().slice(0, 2).toUpperCase();
}

function formatTime(value) {
  if (!value) return "";
  return new Date(value).toLocaleString("bn-BD", {
    hour: "2-digit", minute: "2-digit", day: "numeric", month: "short"
  });
}

function setAvatar(el, url, name) {
  if (url) {
    el.innerHTML = `<img src="${escapeHTML(url)}" alt="">`;
  } else {
    el.textContent = initials(name);
  }
}

/* ====================== MODAL SYSTEM ====================== */
function showModal({ title, bodyHTML, footerHTML, onClose }) {
  const root = $("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <span>${escapeHTML(title)}</span>
          <button id="modalCloseBtn" style="font-size:22px;color:#666">×</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        \( {footerHTML ? `<div class="modal-footer"> \){footerHTML}</div>` : ""}
      </div>
    </div>`;
  
  const close = () => {
    root.innerHTML = "";
    if (onClose) onClose();
  };
  
  $("modalCloseBtn").onclick = close;
  $("modalOverlay").onclick = e => { if (e.target.id === "modalOverlay") close(); };
  
  return { close };
}

function confirmModal(message) {
  return new Promise(resolve => {
    const { close } = showModal({
      title: "নিশ্চিত করুন",
      bodyHTML: `<p style="line-height:1.5">${escapeHTML(message)}</p>`,
      footerHTML: `
        <button class="secondary" id="confirmNo">না</button>
        <button class="primary" id="confirmYes">হ্যাঁ</button>`
    });
    $("confirmNo").onclick = () => { close(); resolve(false); };
    $("confirmYes").onclick = () => { close(); resolve(true); };
  });
}

/* ====================== AUTH UI ====================== */
function showLogin() {
  $("loginPage").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("otherPage").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("topName").textContent = "Guest";
}

function showApp() {
  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("otherPage").classList.add("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("topName").textContent = myProfile?.display_name || currentUser?.email || "Member";
}

function showPage(page) {
  currentPage = page;
  $("app").classList.remove("chat-open");
  
  if (page === "chats") {
    $("otherPage").classList.add("hidden");
    $("app").classList.remove("hidden");
  } else {
    $("app").classList.add("hidden");
    $("otherPage").classList.remove("hidden");
    ["membersPage", "profilePage", "adminPage"].forEach(id => $(id).classList.add("hidden"));
    $(page + "Page").classList.remove("hidden");
    if (page === "members") loadMembersPage();
    if (page === "profile") loadProfilePage();
    if (page === "admin") loadAdminPage();
  }
  
  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });
}

function isApproved() {
  return !!(myProfile && (myProfile.approved === true || myProfile.status === "approved"));
}

/* ====================== LOGIN / LOGOUT ====================== */
$("loginBtn").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();
  if (!email || !email.includes("@")) {
    toast("সঠিক ইমেইল লিখুন");
    return;
  }
  
  $("loginBtn").disabled = true;
  $("loginMessage").textContent = "লগইন লিংক পাঠানো হচ্ছে...";
  
  const { error } = await db.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href }
  });
  
  $("loginBtn").disabled = false;
  
  if (error) {
    $("loginMessage").textContent = error.message;
    toast("লিংক পাঠানো যায়নি");
  } else {
    $("loginMessage").textContent = "✅ ইমেইল চেক করুন। লগইন লিংক পাঠানো হয়েছে।";
    toast("লিংক পাঠানো হয়েছে");
  }
});

$("logoutBtn").addEventListener("click", async () => {
  if (realtimeChannel) await db.removeChannel(realtimeChannel);
  if (refreshTimer) clearInterval(refreshTimer);
  await db.auth.signOut();
  currentUser = null;
  myProfile = null;
  activeConversation = null;
  showLogin();
  toast("সফলভাবে লগআউট হয়েছে");
});

/* =================
