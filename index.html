<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bigo Family Live - Ultra Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-main: #05070e;
            --panel-bg: rgba(11, 16, 28, 0.88);
            --card-bg: rgba(20, 29, 48, 0.8);
            --bigo-cyan: #00f2fe;
            --bigo-pink: #ff0844;
            --bigo-purple: #7f00ff;
            --bigo-gold: #ffb100;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.16);
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 242, 254, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 8, 68, 0.25) 0%, transparent 40%);
        }

        header {
            height: 62px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--bigo-cyan), #00c6ff, var(--bigo-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-body { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        .tab-view { display: none; width: 100%; height: 100%; overflow-y: auto; position: absolute; top: 0; left: 0; }
        .tab-view.active { display: flex; flex-direction: column; }

        .live-stage { flex: 1; background: #000; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        .pk-stage-container { width: 100%; height: 100%; display: flex; position: relative; }
        .pk-screen-left, .pk-screen-right { flex: 1; height: 100%; position: relative; overflow: hidden; border-right: 1px solid rgba(255,255,255,0.1); }
        canvas.live-video-sim { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .pk-battle-bar-box {
            position: absolute; top: 70px; left: 14px; right: 14px; height: 32px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border: 1px solid var(--border-glass);
            border-radius: 20px; z-index: 25; display: flex; align-items: center; padding: 4px; overflow: hidden;
        }
        .pk-bar-blue { height: 100%; width: 55%; background: linear-gradient(90deg, #00c6ff, #0072ff); border-radius: 16px 0 0 16px; display: flex; align-items: center; padding-left: 10px; font-size: 0.75rem; font-weight: 900; }
        .pk-bar-red { height: 100%; width: 45%; background: linear-gradient(90deg, #f71060, #ff416c); border-radius: 0 16px 16px 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 0.75rem; font-weight: 900; }
        .pk-vs-badge { position: absolute; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--bigo-gold), var(--bigo-pink)); color: #fff; font-size: 0.8rem; font-weight: 900; padding: 4px 12px; border-radius: 14px; }

        .live-header-bar { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 26; }
        .host-info { display: flex; align-items: center; gap: 10px; background: rgba(10,15,28,0.75); padding: 5px 14px 5px 5px; border-radius: 30px; backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.2); }
        .host-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--bigo-pink); object-fit: cover; }

        .live-chat-overlay { position: absolute; bottom: 85px; left: 14px; width: 75%; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 26; scrollbar-width: none; }
        .chat-bubble-live { background: rgba(11,16,28,0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 16px; font-size: 0.85rem; color: #fff; }

        nav.bottom-nav {
            height: var(--nav-height); background: var(--panel-bg); backdrop-filter: blur(24px);
            border-top: 1px solid var(--border-glass); display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; cursor: pointer; flex: 1; }
        .nav-btn.active { color: var(--bigo-cyan); }
        .nav-icon { font-size: 1.45rem; }
        .center-action-btn { width: 54px; height: 54px; background: linear-gradient(135deg, var(--bigo-pink), var(--bigo-purple)); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.7rem; color: #fff; margin-top: -26px; border: 3px solid var(--bg-main); cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="brand-logo">✨ Bigo Family Live</div>
</header>

<div class="app-body">
    <div id="view-live" class="tab-view active">
        <div class="live-stage">
            <div class="pk-stage-container">
                <div class="pk-screen-left"><canvas id="liveCanvasSimLeft" class="live-video-sim"></canvas></div>
                <div class="pk-screen-right"><canvas id="liveCanvasSimRight" class="live-video-sim"></canvas></div>
            </div>
            <div class="pk-battle-bar-box">
                <div class="pk-bar-blue"><span>14,250</span></div>
                <span class="pk-vs-badge">⚡ PK BATTLE ⚡</span>
                <div class="pk-bar-red"><span>11,800</span></div>
            </div>
            <div class="live-header-bar">
                <div class="host-info">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60" class="host-avatar" alt="Host">
                    <div>
                        <div style="font-size: 0.85rem; font-weight: 800;">Ayesha Khan</div>
                        <div style="font-size: 0.65rem; color: #94a3b8;">👁️ 5,940 Viewers</div>
                    </div>
                </div>
            </div>
            <div class="live-chat-overlay">
                <div class="chat-bubble-live"><span style="color:var(--bigo-cyan)">⚡ PK Live:</span> বিগো স্টাইলের PK ব্যাটল শুরু হয়েছে! 🔥</div>
                <div class="chat-bubble-live"><b>Rahim:</b> টিম আয়শা জিতবে! 🚀</div>
            </div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-btn active" onclick="switchNav('live', this)"><span class="nav-icon">📺</span><span>Live PK</span></div>
    <div class="nav-btn" onclick="alert('Party Room Active!')"><span class="nav-icon">🎙️</span><span>Party</span></div>
    <div class="nav-btn" onclick="alert('Videos/Reels Active!')"><span class="nav-icon">🎬</span><span>Video</span></div>
    <div class="center-action-btn" onclick="alert('Create Post / Live')">+</div>
    <div class="nav-btn" onclick="alert('Chats Active!')"><span class="nav-icon">💬</span><span>Chats</span></div>
    <div class="nav-btn" onclick="alert('Profile Active!')"><span class="nav-icon">👤</span><span>Me</span></div>
</nav>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    }
    function setupPkCanvas(id, hueOffset) {
        const c = document.getElementById(id);
        if(!c) return;
        const cx = c.getContext('2d');
        function resize() { c.width = c.clientWidth; c.height = c.clientHeight; }
        resize();
        window.addEventListener('resize', resize);
        let step = Math.random() * 10;
        function render() {
            step += 0.025;
            if(c.width > 0) {
                const g = cx.createRadialGradient(c.width/2, c.height/2, 20, c.width/2, c.height/2, c.height);
                g.addColorStop(0, `hsl(${Math.sin(step) * 40 + hueOffset}, 85%, 22%)`);
                g.addColorStop(1, '#05070e');
                cx.fillStyle = g;
                cx.fillRect(0, 0, c.width, c.height);
            }
            requestAnimationFrame(render);
        }
        render();
    }
    setupPkCanvas('liveCanvasSimLeft', 200);
    setupPkCanvas('liveCanvasSimRight', 340);
</script>
</body>
</html>
