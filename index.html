
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2481cc">
<title>Family Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#2481cc;
  --blue-dark:#1769aa;
  --blue-light:#e3f2ff;
  --bg:#eaf2f8;
  --white:#fff;
  --text:#17212b;
  --muted:#718096;
  --border:#e1e8ef;
  --green:#d9fdd3;
  --danger:#e34b4b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
  height:58px;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}
.brand{font-size:19px;font-weight:bold}
.top-actions{display:flex;align-items:center;gap:10px}
.top-actions button{
  border:1px solid #ffffff55;
  border-radius:8px;
  padding:7px 10px;
  background:transparent;
  color:white;
}
.app{
  height:calc(100dvh - 58px);
  max-width:1450px;
  margin:auto;
  display:flex;
  background:white;
  overflow:hidden;
}
.sidebar{
  width:340px;
  min-width:290px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}
.side-head{padding:13px}
.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:22px;
  background:#f2f6fa;
  padding:12px 15px;
  outline:none;
}
.search:focus{border-color:var(--blue)}
.tabs{display:flex;gap:4px;padding:0 9px 10px}
.tabs button{
  flex:1;
  padding:9px 3px;
  border:0;
  border-radius:18px;
  color:#526273;
  background:#edf3f8;
  font-size:12px;
}
.tabs button.active{
  background:var(--blue-light);
  color:var(--blue-dark);
  font-weight:bold;
}
.chat-list{flex:1;overflow:auto}
.chat-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border-bottom:1px solid #f1f3f5;
  cursor:pointer;
}
.chat-item:hover,.chat-item.active{background:#e8f3fc}
.avatar{
  width:47px;height:47px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#dceaf6;
  color:var(--blue-dark);
  font-weight:bold;
  object-fit:cover;
}
.chat-info{min-width:0;flex:1}
.chat-name{font-weight:bold;margin-bottom:5px}
.chat-preview{
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#eaf2f8;
}
.chat-head{
  min-height:64px;
  padding:8px 14px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}
.chat-head-info{flex:1;min-width:0}
.chat-title{font-weight:bold}
.chat-status{font-size:12px;color:var(--muted);margin-top:4px}
.back-btn{
  display:none;
  border:0;background:transparent;
  color:var(--blue);font-size:27px;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:17px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.message{
  max-width:min(78%,540px);
  background:white;
  padding:10px 12px;
  border-radius:14px 14px 14px 3px;
  box-shadow:0 1px 2px #00000012;
  align-self:flex-start;
  overflow-wrap:anywhere;
}
.message.mine{
  background:var(--green);
  align-self:flex-end;
  border-radius:14px 14px 3px 14px;
}
.message-sender{
  color:var(--blue-dark);
  font-weight:bold;
  font-size:12px;
  margin-bottom:5px;
}
.message-text{white-space:pre-wrap;line-height:1.4}
.message img{
  max-width:100%;
  max-height:300px;
  display:block;
  border-radius:10px;
  margin-top:5px;
}
.message-time{
  text-align:right;
  color:#788995;
  font-size:10px;
  margin-top:6px;
}
.reply-quote{
  background:#edf5fc;
  border-left:3px solid var(--blue);
  padding:6px 8px;
  border-radius:5px;
  margin-bottom:7px;
  font-size:12px;
  color:#526273;
}
.message-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:7px;
  font-size:12px;
}
.message-actions button{
  border:0;background:transparent;
  color:#536b7e;padding:2px;
}
.reactions{font-size:13px;margin-top:5px}
.composer{
  background:white;
  padding:9px;
  display:flex;
  align-items:center;
  gap:7px;
  border-top:1px solid var(--border);
}
.composer input{
  flex:1;min-width:0;
  border:0;outline:0;
  background:#f1f5f8;
  padding:12px 14px;
  border-radius:22px;
}
.icon-btn{
  border:0;background:transparent;
  color:var(--blue);font-size:22px;
  padding:6px;
}
.send-btn{
  width:43px;height:43px;
  border:0;border-radius:50%;
  background:var(--blue);
  color:white;font-size:19px;
}
.reply-preview{
  padding:8px 12px;
  background:#edf6ff;
  border-left:3px solid var(--blue);
  font-size:13px;
}
.pages{
  flex:1;overflow:auto;
  padding:18px;background:white;
}
.panel{
  max-width:700px;
  margin:12px auto;
  padding:19px;
  border:1px solid var(--border);
  border-radius:14px;
  background:white;
}
.panel input,.panel textarea{
  width:100%;
  padding:11px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:8px;
}
.primary{
  background:var(--blue);
  color:white;border:0;
  padding:10px 16px;
  border-radius:8px;
}
.secondary{
  background:#edf3f8;
  color:#29465e;border:0;
  padding:9px 13px;
  border-radius:8px;
}
.danger{
  background:#ffeded;color:#bd3030;
  border:0;padding:8px 12px;border-radius:8px;
}
.member-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.member-info{flex:1;min-width:0}
.member-email{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.small{font-size:12px;color:var(--muted)}
.toast{
  position:fixed;z-index:100;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#17212b;color:white;
  padding:11px 17px;border-radius:22px;
  max-width:90%;text-align:center;
}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.login-wrap{
  min-height:calc(100dvh - 58px);
  display:flex;align-items:center;justify-content:center;
  padding:15px;
}
.login-card{
  width:min(420px,100%);
  background:white;padding:25px;
  border-radius:17px;
  box-shadow:0 8px 35px #17466b18;
}
.login-card input{
  width:100%;padding:13px;
  border:1px solid var(--border);
  border-radius:9px;margin:10px 0;
}
.login-card button{width:100%;padding:13px}
@media(max-width:700px){
  .topbar{height:54px;padding:0 11px}
  .app{height:calc(100dvh - 54px);position:relative}
  .sidebar{width:100%;min-width:0;border:0}
  .chat-main{display:none;width:100%}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .chat-main{display:flex}
  .back-btn{display:block}
  .messages{padding:12px 8px}
  .message{max-width:88%}
  .chat-head{min-height:58px}
  .composer{padding:7px}
  .pages{padding:10px}
  .tabs button{font-size:11px}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">💬 Family Connect</div>
  <div class="top-actions">
    <span id="topName">Guest</span>
    <button id="logoutBtn" class="hidden">Logout</button>
  </div>
</header>

<section id="loginPage" class="login-wrap">
  <div class="login-card">
    <h2>Family Connect</h2>
    <p>আপনার পরিবারের ব্যক্তিগত যোগাযোগ</p>
    <input id="emailInput" type="email" placeholder="আপনার ইমেইল লিখুন">
    <button class="primary" id="loginBtn">Send Login Link</button>
    <p class="small" id="loginMessage">আপনার ইমেইলে লগইন লিংক পাঠানো হবে।</p>
  </div>
</section>

<main class="app hidden" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <input class="search" id="chatSearch" placeholder="চ্যাট খুঁজুন...">
    </div>
    <div class="tabs">
      <button class="active" data-page="chats">Chats</button>
      <button data-page="members">Members</button>
      <button data-page="profile">Profile</button>
      <button data-page="admin">Admin</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <section class="chat-main">
    <div class="chat-head">
      <button class="back-btn" id="backBtn">‹</button>
      <div class="avatar" id="chatAvatar">FC</div>
      <div class="chat-head-info">
        <div class="chat-title" id="chatTitle">Family Connect</div>
        <div class="chat-status" id="chatStatus">একটি চ্যাট নির্বাচন করুন</div>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty">চ্যাট শুরু করতে একজন সদস্য নির্বাচন করুন।</div>
    </div>
    <div id="replyPreview" class="reply-preview hidden"></div>
    <div class="composer">
      <button class="icon-btn" id="emojiBtn" title="Emoji">☺</button>
      <button class="icon-btn" id="imageBtn" title="ছবি পাঠান">📎</button>
      <input id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
      <input type="file" id="imageFile" accept="image/*" hidden>
    </div>
  </section>
</main>

<section id="otherPage" class="pages hidden">
  <div id="membersPage" class="hidden"></div>
  <div id="profilePage" class="hidden"></div>
  <div id="adminPage" class="hidden"></div>
</section>

<div id="toast" class="toast hidden"></div>

<script>
/* ==========================================
   SUPABASE CONFIGURATION
   তোমার আগের Project URL ও Publishable Key
========================================== */
const SUPABASE_URL = "https://vtvwfyooiblpcoofzdav.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rb2tYhvPfhZlqGV0gPCLA_SODQoFNg";

const ADMIN_EMAIL = "sagor516@gmail.com";
const AVATAR_BUCKET = "familly-avatars";
const IMAGE_BUCKET = "family-chat-images";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let myProfile = null;
let isAdmin = false;
let activeConversation = null;
let activeConversationKind = null;
let activeChatName = "";
let activeChatAvatar = "";
let currentReply = null;
let messagesCache = [];
let membersCache = [];
let conversationsCache = [];
let realtimeChannel = null;
let refreshTimer = null;
let editingMessageId = null;
let currentPage = "chats";

const $ = id => document.getElementById(id);

function toast(message){
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");
  setTimeout(()=>$("toast").classList.add("hidden"),3000);
}
function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function initials(name){
  return (name || "FC").trim().slice(0,2).toUpperCase();
}
function formatTime(value){
  if(!value)return "";
  return new Date(value).toLocaleString("bn-BD",{
    hour:"2-digit",minute:"2-digit",
    day:"numeric",month:"short"
  });
}
function setAvatar(element, url, name){
  if(url){
    element.innerHTML = `<img src="${escapeHTML(url)}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  }else{
    element.textContent = initials(name);
  }
}
function showLogin(){
  $("loginPage").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("otherPage").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("topName").textContent = "Guest";
}
function showApp(){
  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("otherPage").classList.add("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("topName").textContent = myProfile?.display_name || currentUser?.email || "Member";
}
function showPage(page){
  currentPage = page;
  $("app").classList.remove("chat-open");
  if(page === "chats"){
    $("otherPage").classList.add("hidden");
    $("app").classList.remove("hidden");
  }else{
    $("app").classList.add("hidden");
    $("otherPage").classList.remove("hidden");
    ["membersPage","profilePage","adminPage"].forEach(id=>{
      $(id).classList.add("hidden");
    });
    $(page+"Page").classList.remove("hidden");
    if(page === "members") loadMembersPage();
    if(page === "profile") loadProfilePage();
    if(page === "admin") loadAdminPage();
  }
  document.querySelectorAll(".tabs button").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });
}
function isApproved(){
  return !!(myProfile && (myProfile.approved === true || myProfile.status === "approved"));
}

/* LOGIN */
$("loginBtn").addEventListener("click", async ()=>{
  const email = $("emailInput").value.trim();
  if(!email || !email.includes("@")){
    toast("সঠিক ইমেইল লিখুন");
    return;
  }
  $("loginBtn").disabled = true;
  $("loginMessage").textContent = "লগইন লিংক পাঠানো হচ্ছে...";
  const {error} = await db.auth.signInWithOtp({
    email,
    options:{emailRedirectTo:window.location.href}
  });
  $("loginBtn").disabled = false;
  if(error){
    $("loginMessage").textContent = error.message;
    toast("লগইন লিংক পাঠানো যায়নি");
  }else{
    $("loginMessage").textContent = "ইমেইল চেক করুন। লগইন লিংক পাঠানো হয়েছে।";
  }
});

$("logoutBtn").addEventListener("click", async ()=>{
  if(realtimeChannel) await db.removeChannel(realtimeChannel);
  if(refreshTimer) clearInterval(refreshTimer);
  await db.auth.signOut();
  currentUser = null;
  myProfile = null;
  activeConversation = null;
  showLogin();
  toast("Logout হয়েছে");
});

/* PROFILE LOAD */
async function loadMyProfile(){
  const {data,error} = await db.from("profiles")
    .select("*").eq("user_id",currentUser.id).maybeSingle();

  if(error) throw error;

  if(!data){
    const name = currentUser.user_metadata?.full_name ||
                 currentUser.email?.split("@")[0] || "New Member";
    const newProfile = {
      user_id:currentUser.id,
      email:currentUser.email,
      display_name:name,
      role:currentUser.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":"member",
      status:currentUser.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"approved":"pending",
      approved:currentUser.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()
    };
    const {data:inserted,error:insertError} = await db.from("profiles")
      .insert(newProfile).select().single();
    if(insertError) throw insertError;
    myProfile = inserted;
  }else{
    myProfile = data;
  }

  isAdmin = myProfile.role === "admin" ||
    currentUser.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  if(isAdmin && myProfile.role !== "admin"){
    await db.from("profiles").update({
      role:"admin",status:"approved",approved:true
    }).eq("user_id",currentUser.id);
    myProfile.role = "admin";
    myProfile.status = "approved";
    myProfile.approved = true;
  }
}

/* APP START */
async function startApp(){
  currentUser = (await db.auth.getUser()).data.user;
  if(!currentUser){showLogin();return;}

  try{
    await loadMyProfile();
    showApp();

    if(!isApproved()){
      $("app").innerHTML = `
        <div class="panel" style="margin:auto">
          <h2>অনুমোদনের অপেক্ষায়</h2>
          <p>তোমার অ্যাকাউন্ট Admin অনুমোদন করলে Family Connect ব্যবহার করতে পারবে।</p>
          <p>Account: ${escapeHTML(currentUser.email)}</p>
          <button class="secondary" onclick="location.reload()">Refresh</button>
          <button class="danger" onclick="db.auth.signOut().then(()=>location.reload())">Logout</button>
        </div>`;
      return;
    }

    await loadChatList();
    await loadMembersCache();
    subscribeRealtime();
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(async ()=>{
      await loadChatList();
      if(activeConversation) await loadMessages();
    },25000);
  }catch(error){
    console.error(error);
    toast("অ্যাপ চালু করতে সমস্যা: "+error.message);
  }
}

/* MEMBER DATA */
async function loadMembersCache(){
  const {data,error} = await db.from("profiles")
    .select("user_id,email,display_name,avatar_url,role,status,approved")
    .order("display_name");
  if(error) throw error;
  membersCache = data || [];
}

/* CHAT LIST */
async function loadChatList(){
  const {data:myMemberships,error} = await db.from("conversation_members")
    .select("conversation_id")
    .eq("owner_id",currentUser.id);
  if(error) throw error;

  const ids = [...new Set((myMemberships||[]).map(x=>x.conversation_id))];
  if(ids.length===0){
    conversationsCache = [];
    renderChatList();
    return;
  }

  const {data:conversations,error:convError} = await db.from("conversations")
    .select("*").in("id",ids).order("created_at",{ascending:false});
  if(convError) throw convError;

  const {data:allMembers,error:memError} = await db.from("conversation_members")
    .select("conversation_id,owner_id").in("conversation_id",ids);
  if(memError) throw memError;

  const userIds = [...new Set((allMembers||[]).map(x=>x.owner_id))];
  const {data:profiles,error:profileError} = await db.from("profiles")
    .select("user_id,email,display_name,avatar_url")
    .in("user_id",userIds);
  if(profileError) throw profileError;

  const {data:latestMessages} = await db.from("messages")
    .select("conversation_id,message_text,attachment_kind,created_at")
    .in("conversation_id",ids)
    .order("created_at",{ascending:false})
    .limit(200);

  conversationsCache = (conversations||[]).map(conv=>{
    const participants = (allMembers||[])
      .filter(m=>m.conversation_id===conv.id)
      .map(m=>profiles?.find(p=>p.user_id===m.owner_id))
      .filter(Boolean);

    const other = participants.find(p=>p.user_id!==currentUser.id);
    const group = conv.conversation_kind==="family_group";
    const last = (latestMessages||[]).find(m=>m.conversation_id===conv.id);

    return {
      ...conv,
      name:group?"Family Group":(other?.display_name || other?.email || "Private Chat"),
      avatar:group?"":other?.avatar_url || "",
      participants,
      preview:last?(last.message_text || (last.attachment_kind?"📷 ছবি":"")):"No messages yet",
      lastTime:last?.created_at || conv.created_at
    };
  });

  conversationsCache.sort((a,b)=>new Date(b.lastTime)-new Date(a.lastTime));
  renderChatList();
}

function renderChatList(){
  const q = $("chatSearch").value.trim().toLowerCase();
  const list = conversationsCache.filter(c=>c.name.toLowerCase().includes(q));
  $("chatList").innerHTML = "";

  if(!list.length){
    $("chatList").innerHTML = `<div class="empty">এখনো কোনো চ্যাট নেই। Members থেকে চ্যাট শুরু করুন।</div>`;
    return;
  }

  list.forEach(c=>{
    const item = document.createElement("div");
    item.className = "chat-item"+(activeConversation===c.id?" active":"");
    const avatar = c.conversation_kind==="family_group"?"👨‍👩‍👧‍👦":
      `<span>${escapeHTML(initials(c.name))}</span>`;
    item.innerHTML = `
      <div class="avatar">${c.avatar?`<img src="${escapeHTML(c.avatar)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:avatar}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHTML(c.name)}</div>
        <div class="chat-preview">${escapeHTML(c.preview)}</div>
      </div>`;
    item.addEventListener("click",()=>openConversation(c));
    $("chatList").appendChild(item);
  });
}

$("chatSearch").addEventListener("input",renderChatList);

async function openConversation(conv){
  activeConversation = conv.id;
  activeConversationKind = conv.conversation_kind;
  activeChatName = conv.name;
  activeChatAvatar = conv.avatar;
  $("chatTitle").textContent = conv.name;
  $("chatStatus").textContent = conv.conversation_kind==="family_group"?
    "Family Group":"Private Chat";
  setAvatar($("chatAvatar"),conv.avatar,conv.name);
  $("app").classList.add("chat-open");
  currentReply = null;
  $("replyPreview").classList.add("hidden");
  editingMessageId = null;
  await loadMessages();
  renderChatList();
  if(realtimeChannel){
    await db.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  subscribeRealtime();
}
$("backBtn").addEventListener("click",()=>{
  $("app").classList.remove("chat-open");
});

/* CREATE OR OPEN PRIVATE CHAT */
async function startPrivateChat(profile){
  if(profile.user_id===currentUser.id){
    toast("নিজের সঙ্গে চ্যাট করা যাবে না");
    return;
  }
  if(profile.approved!==true && profile.status!=="approved"){
    toast("এই সদস্য এখনো অনুমোদিত নয়");
    return;
  }

  const {data:mine,error:e1} = await db.from("conversation_members")
    .select("conversation_id").eq("owner_id",currentUser.id);
  if(e1){toast(e1.message);return;}

  const ids = (mine||[]).map(x=>x.conversation_id);
  let found = null;

  if(ids.length){
    const {data:their,error:e2} = await db.from("conversation_members")
      .select("conversation_id").eq("owner_id",profile.user_id).in("conversation_id",ids);
    if(e2){toast(e2.message);return;}
    const common = (their||[]).map(x=>x.conversation_id);
    if(common.length){
      const {data:convs} = await db.from("conversations")
        .select("*").in("id",common).eq("conversation_kind","private");
      found = convs?.[0] || null;
    }
  }

  if(!found){
    const {data:newConv,error:createError} = await db.from("conversations")
      .insert({conversation_kind:"private"}).select().single();
    if(createError){toast("চ্যাট তৈরি হয়নি: "+createError.message);return;}

    const {error:memberError} = await db.from("conversation_members").insert([
      {conversation_id:newConv.id,owner_id:currentUser.id},
      {conversation_id:newConv.id,owner_id:profile.user_id}
    ]);
    if(memberError){toast("সদস্য যোগ হয়নি: "+memberError.message);return;}
    found = newConv;
  }

  const conv = {
    ...found,
    name:profile.display_name || profile.email,
    avatar:profile.avatar_url || "",
    participants:[profile]
  };
  await loadChatList();
  await openConversation(conv);
  showPage("chats");
}

/* FAMILY GROUP */
async function openFamilyGroup(){
  const {data:mine,error} = await db.from("conversation_members")
    .select("conversation_id").eq("owner_id",currentUser.id);
  if(error){toast(error.message);return;}

  const ids = (mine||[]).map(x=>x.conversation_id);
  let group = null;
  if(ids.length){
    const {data} = await db.from("conversations")
      .select("*").in("id",ids).eq("conversation_kind","family_group");
    group = data?.[0] || null;
  }

  if(!group){
    if(!isAdmin){
      toast("Family Group এখনো তৈরি হয়নি। Admin-কে তৈরি করতে বলুন।");
      return;
    }
    const {data:newGroup,error:createError} = await db.from("conversations")
      .insert({conversation_kind:"family_group"}).select().single();
    if(createError){toast(createError.message);return;}
    group = newGroup;

    const approved = membersCache.filter(m=>
      m.approved===true || m.status==="approved"
    );
    const rows = [...new Set([currentUser.id,...approved.map(m=>m.user_id)])]
      .map(owner_id=>({conversation_id:group.id,owner_id}));
    const {error:joinError} = await db.from("conversation_members").insert(rows);
    if(joinError){toast(joinError.message);return;}
  }else if(isAdmin){
    const {data:existing} = await db.from("conversation_members")
      .select("owner_id").eq("conversation_id",group.id);
    const existingIds = new Set((existing||[]).map(x=>x.owner_id));
    const approved = membersCache.filter(m=>
      (m.approved===true || m.status==="approved") && !existingIds.has(m.user_id)
    );
    if(approved.length){
      await db.from("conversation_members").insert(
        approved.map(m=>({conversation_id:group.id,owner_id:m.user_id}))
      );
    }
  }

  await loadChatList();
  await openConversation({
    ...group,name:"Family Group",avatar:""
  });
  showPage("chats");
}

/* LOAD MESSAGES */
async function loadMessages(){
  if(!activeConversation)return;
  const {data,error} = await db.from("messages")
    .select("*")
    .eq("conversation_id",activeConversation)
    .order("created_at",{ascending:true})
    .limit(300);

  if(error){console.error(error);toast("মেসেজ লোড হয়নি: "+error.message);return;}

  const rows = data || [];
  const senderIds = [...new Set(rows.map(m=>m.owner_id))];
  let profiles = [];
  if(senderIds.length){
    const result = await db.from("profiles")
      .select("user_id,display_name,email,avatar_url")
      .in("user_id",senderIds);
    profiles = result.data || [];
  }

  const msgIds = rows.map(m=>m.id);
  let reactions = [];
  if(msgIds.length){
    const result = await db.from("message_reactions")
      .select("*").in("message_id",msgIds);
    reactions = result.data || [];
  }

  messagesCache = rows;
  renderMessages(rows,profiles,reactions);
}

function renderMessages(rows,profiles,reactions){
  const box = $("messages");
  box.innerHTML = "";

  if(!rows.length){
    box.innerHTML = `<div class="empty">এখনো কোনো মেসেজ নেই। প্রথম মেসেজটি পাঠান।</div>`;
    return;
  }

  rows.forEach(msg=>{
    const mine = msg.owner_id===currentUser.id;
    const sender = profiles.find(p=>p.user_id===msg.owner_id);
    const reply = msg.reply_to_id?rows.find(m=>m.id===msg.reply_to_id):null;
    const related = reactions.filter(r=>r.message_id===msg.id);

    const div = document.createElement("div");
    div.className = "message"+(mine?" mine":"");

    let body = "";
    if(activeConversationKind==="family_group"){
      body += `<div class="message-sender">${escapeHTML(sender?.display_name || sender?.email || "Member")}</div>`;
    }
    if(reply){
      body += `<div class="reply-quote">↪ ${escapeHTML(reply.message_text || "ছবি")}</div>`;
    }
    if(msg.message_text){
      body += `<div class="message-text">${escapeHTML(msg.message_text)}</div>`;
    }
    if(msg.attachment_url){
      body += `<a href="${escapeHTML(msg.attachment_url)}" target="_blank" rel="noopener"><img src="${escapeHTML(msg.attachment_url)}" alt="ছবি"></a>`;
    }
    body += `<div class="message-time">${formatTime(msg.created_at)}${msg.updated_at?" · edited":""}</div>`;

    if(related.length){
      body += `<div class="reactions">${related.map(r=>escapeHTML(r.emoji)).join(" ")}</div>`;
    }

    body += `<div class="message-actions">
      <button data-action="reply">↩ Reply</button>
      <button data-action="react">❤️</button>
      ${mine?`<button data-action="edit">Edit</button><button data-action="delete">Delete</button>`:""}
    </div>`;

    div.innerHTML = body;
    div.querySelector('[data-action="reply"]').onclick=()=>setReply(msg);
    div.querySelector('[data-action="react"]').onclick=()=>reactToMessage(msg);
    const edit=div.querySelector('[data-action="edit"]');
    if(edit)edit.onclick=()=>editMessage(msg);
    const del=div.querySelector('[data-action="delete"]');
    if(del)del.onclick=()=>deleteMessage(msg);

    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

/* SEND MESSAGE */
async function sendMessage(){
  if(!activeConversation){toast("আগে একটি চ্যাট নির্বাচন করুন");return;}
  const text = $("messageInput").value.trim();
  if(!text){return;}

  const payload = {
    conversation_id:activeConversation,
    owner_id:currentUser.id,
    message_text:text,
    reply_to_id:currentReply?.id || null
  };

  const {error} = await db.from("messages").insert(payload);
  if(error){toast("মেসেজ পাঠানো যায়নি: "+error.message);return;}

  $("messageInput").value="";
  currentReply=null;
  $("replyPreview").classList.add("hidden");
  await loadMessages();
  await loadChatList();
}
$("sendBtn").addEventListener("click",sendMessage);
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

/* REPLY */
function setReply(msg){
  currentReply = msg;
  $("replyPreview").innerHTML =
    `↩ Replying to: ${escapeHTML(msg.message_text || "ছবি")}
     <button id="cancelReply" style="float:right;border:0;background:none">✕</button>`;
  $("replyPreview").classList.remove("hidden");
  $("cancelReply").onclick=()=>{
    currentReply=null;
    $("replyPreview").classList.add("hidden");
  };
  $("messageInput").focus();
}

/* EDIT */
async function editMessage(msg){
  const newText = prompt("মেসেজ পরিবর্তন করুন:",msg.message_text || "");
  if(newText===null)return;
  if(!newText.trim()){toast("খালি মেসেজ করা যাবে না");return;}

  const {error} = await db.from("messages")
    .update({message_text:newText.trim(),updated_at:new Date().toISOString()})
    .eq("id",msg.id).eq("owner_id",currentUser.id);

  if(error){toast("Edit হয়নি: "+error.message);return;}
  toast("মেসেজ আপডেট হয়েছে");
  await loadMessages();
}

/* DELETE */
async function deleteMessage(msg){
  if(!confirm("এই মেসেজটি মুছে ফেলতে চান?"))return;
  const {error} = await db.from("messages")
    .delete().eq("id",msg.id).eq("owner_id",currentUser.id);
  if(error){toast("Delete হয়নি: "+error.message);return;}
  toast("মেসেজ মুছে ফেলা হয়েছে");
  await loadMessages();
}

/* REACTION */
async function reactToMessage(msg){
  const emoji = prompt("একটি Reaction লিখুন:", "❤️");
  if(!emoji)return;

  const {data:existing} = await db.from("message_reactions")
    .select("*").eq("message_id",msg.id).eq("user_id",currentUser.id);

  if(existing?.length){
    const {error} = await db.from("message_reactions")
      .update({emoji}).eq("message_id",msg.id).eq("user_id",currentUser.id);
    if(error){toast(error.message);return;}
  }else{
    const {error} = await db.from("message_reactions").insert({
      message_id:msg.id,user_id:currentUser.id,emoji
    });
    if(error){toast(error.message);return;}
  }
  await loadMessages();
}
$("emojiBtn").onclick=()=>{
  const emoji=prompt("Emoji লিখুন:", "😊");
  if(emoji)$("messageInput").value += emoji;
  $("messageInput").focus();
};

/* IMAGE UPLOAD */
$("imageBtn").onclick=()=>$("imageFile").click();

$("imageFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  if(!activeConversation){toast("আগে চ্যাট নির্বাচন করুন");e.target.value="";return;}
  if(!file.type.startsWith("image/")){toast("শুধু ছবি নির্বাচন করুন");return;}
  if(file.size>8*1024*1024){toast("ছবির সাইজ ৮ MB-এর কম রাখুন");return;}

  toast("ছবি আপলোড হচ্ছে...");
  const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");
  const path=`${currentUser.id}/${Date.now()}.${ext}`;

  const {error:uploadError} = await db.storage.from(IMAGE_BUCKET)
    .upload(path,file,{upsert:true,contentType:file.type});

  if(uploadError){toast("ছবি আপলোড হয়নি: "+uploadError.message);e.target.value="";return;}

  const {data:urlData} = db.storage.from(IMAGE_BUCKET).getPublicUrl(path);
  const {error:messageError} = await db.from("messages").insert({
    conversation_id:activeConversation,
    owner_id:currentUser.id,
    message_text:"",
    attachment_url:urlData.publicUrl,
    attachment_kind:"image",
    reply_to_id:currentReply?.id || null
  });

  if(messageError){toast("ছবি মেসেজ হয়নি: "+messageError.message);}
  else{
    currentReply=null;
    $("replyPreview").classList.add("hidden");
    toast("ছবি পাঠানো হয়েছে");
    await loadMessages();
    await loadChatList();
  }
  e.target.value="";
});

/* REALTIME */
function subscribeRealtime(){
  if(!activeConversation)return;
  if(realtimeChannel){
    db.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }
  realtimeChannel = db.channel("family-chat-"+activeConversation)
    .on("postgres_changes",{
      event:"*",schema:"public",table:"messages",
      filter:"conversation_id=eq."+activeConversation
    },async ()=>{
      await loadMessages();
      await loadChatList();
    })
    .subscribe();
}

/* MEMBERS PAGE */
async function loadMembersPage(){
  const el=$("membersPage");
  el.innerHTML=`<div class="panel"><h2>পরিবারের সদস্য</h2><p class="small">অনুমোদিত সদস্যদের সঙ্গে ব্যক্তিগত চ্যাট শুরু করুন।</p><div id="membersList">লোড হচ্ছে...</div><button class="secondary" id="familyGroupBtn">👨‍👩‍👧‍👦 Family Group খুলুন</button></div>`;

  const {data,error}=await db.from("profiles")
    .select("user_id,email,display_name,avatar_url,role,status,approved")
    .order("display_name");
  if(error){$("membersList").textContent=error.message;return;}
  membersCache=data||[];

  const list=$("membersList");
  list.innerHTML="";
  const approved=membersCache.filter(m=>m.approved===true||m.status==="approved");

  approved.forEach(m=>{
    if(m.user_id===currentUser.id)return;
    const row=document.createElement("div");
    row.className="member-row";
    row.innerHTML=`
      <div class="avatar">${m.avatar_url?`<img src="${escapeHTML(m.avatar_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:escapeHTML(initials(m.display_name))}</div>
      <div class="member-info">
        <b>${escapeHTML(m.display_name||"Member")}</b>
        <div class="member-email">${escapeHTML(m.email||"")}</div>
      </div>
      <button class="primary">Chat</button>`;
    row.querySelector("button").onclick=()=>startPrivateChat(m);
    list.appendChild(row);
  });

  if(!approved.length)list.innerHTML=`<p class="empty">কোনো অনুমোদিত সদস্য নেই।</p>`;
  $("familyGroupBtn").onclick=openFamilyGroup;
}

/* PROFILE PAGE */
async function loadProfilePage(){
  const p=myProfile||{};
  $("profilePage").innerHTML=`
    <div class="panel">
      <h2>প্রোফাইল সেটিংস</h2>
      <div style="display:flex;align-items:center;gap:15px;margin:15px 0">
        <div class="avatar" id="profileAvatar" style="width:75px;height:75px;font-size:22px"></div>
        <div><b>${escapeHTML(p.display_name||"Member")}</b><div class="small">${escapeHTML(currentUser.email)}</div></div>
      </div>
      <label>নাম</label>
      <input id="profileName" value="${escapeHTML(p.display_name||"")}">
      <label>প্রোফাইল ছবি</label>
      <input id="avatarFile" type="file" accept="image/*">
      <button class="primary" id="saveProfileBtn">Save Profile</button>
      <p class="small">Role: ${escapeHTML(p.role||"member")} · Status: ${escapeHTML(p.status||"pending")}</p>
    </div>`;
  setAvatar($("profileAvatar"),p.avatar_url,p.display_name);

  $("saveProfileBtn").onclick=saveProfile;
}
async function saveProfile(){
  const name=$("profileName").value.trim();
  if(!name){toast("নাম লিখুন");return;}
  let avatar_url=myProfile.avatar_url||null;
  const file=$("avatarFile").files?.[0];

  if(file){
    if(!file.type.startsWith("image/")){toast("ছবি নির্বাচন করুন");return;}
    const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");
    const path=`${currentUser.id}/avatar-${Date.now()}.${ext}`;
    const {error:upError}=await db.storage.from(AVATAR_BUCKET)
      .upload(path,file,{upsert:true,contentType:file.type});
    if(upError){toast("ছবি আপলোড হয়নি: "+upError.message);return;}
    avatar_url=db.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  const {data,error}=await db.from("profiles").update({
    display_name:name,avatar_url
  }).eq("user_id",currentUser.id).select().single();

  if(error){toast("প্রোফাইল সেভ হয়নি: "+error.message);return;}
  myProfile=data;
  $("topName").textContent=name;
  toast("প্রোফাইল আপডেট হয়েছে");
  loadProfilePage();
}

/* ADMIN PAGE */
async function loadAdminPage(){
  const el=$("adminPage");
  if(!isAdmin){
    el.innerHTML=`<div class="panel"><h2>Admin Dashboard</h2><p>এই পেজ শুধু Admin ব্যবহার করতে পারবেন।</p></div>`;
    return;
  }

  el.innerHTML=`
    <div class="panel">
      <h2>Admin Dashboard</h2>
      <p class="small">পরিবারের সদস্যদের অনুমোদন ও নিয়ন্ত্রণ করুন।</p>
      <button class="secondary" id="refreshAdminBtn">Refresh Members</button>
      <div id="adminMembers">লোড হচ্ছে...</div>
    </div>`;
  $("refreshAdminBtn").onclick=loadAdminMembers;
  await loadAdminMembers();
}

async function loadAdminMembers(){
  const list=$("adminMembers");
  if(!list)return;
  list.textContent="লোড হচ্ছে...";

  const {data,error}=await db.from("profiles")
    .select("user_id,email,display_name,role,status,approved")
    .order("display_name");
  if(error){list.textContent=error.message;return;}

  list.innerHTML="";
  (data||[]).forEach(m=>{
    const approved=m.approved===true||m.status==="approved";
    const row=document.createElement("div");
    row.className="member-row";
    row.innerHTML=`
      <div class="member-info">
        <b>${escapeHTML(m.display_name||"Member")}</b>
        <div class="member-email">${escapeHTML(m.email||"")}</div>
        <div class="small">Role: ${escapeHTML(m.role||"member")} · Status: ${approved?"approved":"pending"}</div>
      </div>
      ${m.user_id===currentUser.id?`<span class="small">You</span>`:
      approved?`<button class="danger" data-action="revoke">Revoke</button>`:
      `<button class="primary" data-action="approve">Approve</button>`}`;
    const btn=row.querySelector("button");
    if(btn){
      btn.onclick=()=>updateMemberStatus(m.user_id,!approved);
    }
    list.appendChild(row);
  });
}

async function updateMemberStatus(userId,approve){
  const {error}=await db.from("profiles").update({
    status:approve?"approved":"pending",
    approved:approve
  }).eq("user_id",userId);

  if(error){toast("পরিবর্তন হয়নি: "+error.message);return;}
  toast(approve?"সদস্য অনুমোদিত হয়েছে":"সদস্যের অনুমোদন বাতিল হয়েছে");
  await loadAdminMembers();
  await loadMembersCache();
}

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>showPage(btn.dataset.page));
});

db.auth.onAuthStateChange((event,session)=>{
  if(session?.user){
    setTimeout(()=>startApp(),0);
  }else if(event==="SIGNED_OUT"){
    showLogin();
  }
});

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session?.user)await startApp();
  else showLogin();
})();
